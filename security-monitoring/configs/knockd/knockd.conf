# Port Knocking Configuration for VCD-01
# Requires knockd daemon
# sudo apt-get install knockd

[options]
    UseSyslog
    LogFile = /var/log/knockd.log

[openSSH]
    sequence    = 7000,8000,9000
    seq_timeout = 5
    command     = /sbin/iptables -I INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
    tcpflags    = syn

[closeSSH]
    sequence    = 9000,8000,7000
    seq_timeout = 5
    command     = /sbin/iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
    tcpflags    = syn

[openVCD01]
    sequence    = 7000,8000,9000
    seq_timeout = 10
    start_command = /sbin/iptables -I INPUT -s %IP% -p tcp --dport 3000 -j ACCEPT
    cmd_timeout = 30
    stop_command = /sbin/iptables -D INPUT -s %IP% -p tcp --dport 3000 -j ACCEPT
    tcpflags    = syn

# Honey token trigger - wrong knock sequence
[wrongKnock]
    sequence    = 7000,7000,7000
    seq_timeout = 5
    command     = /opt/vcd01-honey/alert.sh %IP% "wrong-knock-sequence"
    tcpflags    = syn
