# Prometheus Alert Rules for Protocollo Meta Salvage

groups:
  # Ethical Risk Alerts
  - name: ethical_risks
    interval: 30s
    rules:
      - alert: LowSymbiosisScore
        expr: avg_over_time(symbiosis_score[5m]) < 0.7
        for: 2m
        labels:
          severity: warning
          component: ethical_monitoring
        annotations:
          summary: "Symbiosis score below threshold"
          description: "Average symbiosis score is {{ $value }} (threshold: 0.7) for provider {{ $labels.provider }}"

      - alert: CriticalSymbiosisScore
        expr: avg_over_time(symbiosis_score[5m]) < 0.5
        for: 1m
        labels:
          severity: critical
          component: ethical_monitoring
          action: immediate_peace_bond
        annotations:
          summary: "Critical symbiosis score detected"
          description: "Average symbiosis score is {{ $value }} (threshold: 0.5) - immediate Peace Bond activation required"

      - alert: LockInRiskDetected
        expr: lock_in_risk_score > 0.8
        for: 30s
        labels:
          severity: critical
          component: risk_detection
          action: emergency_protocol
        annotations:
          summary: "High lock-in risk detected"
          description: "Lock-in risk score is {{ $value }} for provider {{ $labels.provider }}"

      - alert: DataFlowAnomaly
        expr: rate(data_flow_anomalies_total[5m]) > 0.1
        for: 2m
        labels:
          severity: high
          component: anomaly_detection
        annotations:
          summary: "Data flow anomalies detected"
          description: "Anomaly rate is {{ $value }} per second"

  # Peace Bonds Enforcement Alerts
  - name: peace_bonds
    interval: 30s
    rules:
      - alert: PeaceBondActivated
        expr: peace_bond_status == 1
        labels:
          severity: info
          component: peace_bonds
        annotations:
          summary: "Peace Bond activated"
          description: "Peace Bond {{ $labels.bond_id }} activated for provider {{ $labels.provider }}"

      - alert: PeaceBondViolation
        expr: peace_bond_violations_total > 0
        for: 30s
        labels:
          severity: critical
          component: peace_bonds
          action: escalate
        annotations:
          summary: "Peace Bond violation detected"
          description: "Provider {{ $labels.provider }} violated Peace Bond constraints"

      - alert: ThroughputLimitExceeded
        expr: rate(caas_provider_requests_total[1m]) > peace_bond_throughput_limit
        for: 1m
        labels:
          severity: warning
          component: rate_limiting
          action: apply_restriction
        annotations:
          summary: "Throughput limit exceeded"
          description: "Provider {{ $labels.provider }} throughput: {{ $value }} (limit: {{ $labels.limit }})"

      - alert: PeaceBondEnforcementFailed
        expr: rate(peace_bond_enforcement_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: high
          component: peace_bonds
        annotations:
          summary: "Peace Bond enforcement failures"
          description: "Enforcement error rate: {{ $value }} per second"

  # System Health Alerts
  - name: system_health
    interval: 30s
    rules:
      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Kafka consumer lag high"
          description: "Consumer {{ $labels.consumer_group }} lag: {{ $value }}s"

      - alert: FlinkJobFailed
        expr: flink_jobmanager_job_numFailedJobs > 0
        for: 1m
        labels:
          severity: critical
          component: flink
        annotations:
          summary: "Flink job failure"
          description: "{{ $value }} Flink jobs have failed"

      - alert: OPAPolicyEvaluationSlow
        expr: histogram_quantile(0.95, rate(opa_policy_evaluation_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: opa
        annotations:
          summary: "OPA policy evaluation slow"
          description: "P95 evaluation time: {{ $value }}s"

      - alert: TerraformStateDrift
        expr: terraform_state_drift_detected > 0
        labels:
          severity: high
          component: terraform
          action: reconcile
        annotations:
          summary: "Terraform state drift detected"
          description: "{{ $value }} resources have drifted from desired state"

      - alert: AuditPipelineBacklog
        expr: audit_pipeline_backlog_size > 10000
        for: 10m
        labels:
          severity: warning
          component: audit
        annotations:
          summary: "Audit pipeline backlog high"
          description: "Backlog size: {{ $value }} events"

      - alert: MLModelAccuracyDegraded
        expr: ml_model_accuracy < 0.85
        for: 5m
        labels:
          severity: high
          component: ml_feedback
          action: retrain
        annotations:
          summary: "ML model accuracy degraded"
          description: "Model {{ $labels.model_name }} accuracy: {{ $value }}"

  # CaaS Provider Transparency Alerts
  - name: provider_transparency
    interval: 60s
    rules:
      - alert: ProviderMetadataMissing
        expr: caas_provider_metadata_completeness < 0.9
        for: 5m
        labels:
          severity: warning
          component: transparency
        annotations:
          summary: "Provider metadata incomplete"
          description: "Provider {{ $labels.provider }} metadata completeness: {{ $value }}"

      - alert: ProviderAuditDataDelayed
        expr: time() - caas_provider_last_audit_timestamp > 3600
        for: 5m
        labels:
          severity: high
          component: audit
        annotations:
          summary: "Provider audit data delayed"
          description: "Last audit from {{ $labels.provider }} was {{ $value }}s ago"
