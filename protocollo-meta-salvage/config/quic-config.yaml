# QUIC Protocol Configuration with TLS 1.3
# Hardened communication protocols for PeaceBonds

# QUIC Server Configuration
server:
  # Bind addresses
  listen:
    - address: 0.0.0.0
      port: 443
      protocol: quic
    - address: 0.0.0.0
      port: 8443
      protocol: quic
  
  # TLS 1.3 Configuration
  tls:
    min_version: "1.3"
    max_version: "1.3"
    
    # Certificate configuration
    certificates:
      - cert_file: /etc/peacebonds/tls/server.crt
        key_file: /etc/peacebonds/tls/server.key
        # Optional OCSP stapling
        ocsp_stapling: true
    
    # Cipher suites (TLS 1.3 only)
    cipher_suites:
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256
      - TLS_AES_128_GCM_SHA256
    
    # Supported groups for key exchange
    supported_groups:
      - x25519
      - secp384r1
      - secp256r1
    
    # Session tickets for 0-RTT
    session_tickets:
      enabled: true
      rotation_interval: 3600  # 1 hour
      max_early_data: 16384    # 16KB
    
    # ALPN protocols
    alpn_protocols:
      - h3           # HTTP/3
      - h3-29        # HTTP/3 draft-29
      - peacebonds   # Custom protocol
  
  # QUIC-specific settings
  quic:
    # Maximum stream data
    max_stream_data_bidi_local: 1048576   # 1MB
    max_stream_data_bidi_remote: 1048576  # 1MB
    max_stream_data_uni: 1048576          # 1MB
    
    # Maximum connection data
    max_data: 10485760  # 10MB
    
    # Stream limits
    max_streams_bidi: 100
    max_streams_uni: 100
    
    # Idle timeout
    max_idle_timeout: 30000  # 30 seconds
    
    # Keep-alive
    keep_alive_interval: 10000  # 10 seconds
    
    # Congestion control
    congestion_control: cubic  # Options: cubic, bbr, bbr2
    
    # Initial RTT
    initial_rtt: 333  # milliseconds
    
    # Enable ECN
    enable_ecn: true
    
    # Disable migration (for security)
    disable_migration: false
    
    # Maximum ACK delay
    max_ack_delay: 25  # milliseconds
    
    # ACK decimation
    ack_eliciting_threshold: 2

# Client Configuration
client:
  tls:
    min_version: "1.3"
    max_version: "1.3"
    
    # Verify server certificate
    verify_peer: true
    ca_file: /etc/peacebonds/tls/ca.crt
    
    # Client certificate (mutual TLS)
    client_cert:
      cert_file: /etc/peacebonds/tls/client.crt
      key_file: /etc/peacebonds/tls/client.key
    
    # Server name for SNI
    server_name: peacebonds.io
    
    # ALPN protocols
    alpn_protocols:
      - h3
      - peacebonds
    
    # Enable session resumption
    session_cache:
      enabled: true
      max_entries: 1000
      lifetime: 7200  # 2 hours
  
  quic:
    # Same as server settings
    max_stream_data_bidi_local: 1048576
    max_stream_data_bidi_remote: 1048576
    max_stream_data_uni: 1048576
    max_data: 10485760
    max_streams_bidi: 100
    max_streams_uni: 100
    max_idle_timeout: 30000
    keep_alive_interval: 10000
    congestion_control: cubic
    initial_rtt: 333
    enable_ecn: true

# Security Hardening
security:
  # Disable insecure protocols
  disable_protocols:
    - http    # Only HTTPS allowed
    - tls1.0
    - tls1.1
    - tls1.2
    - ssl3
    - ssl2
  
  # HTTP Strict Transport Security (HSTS)
  hsts:
    enabled: true
    max_age: 31536000        # 1 year
    include_subdomains: true
    preload: true
  
  # Certificate Transparency
  certificate_transparency:
    enabled: true
    expect_ct: true
    enforce: true
  
  # Content Security Policy
  csp:
    enabled: true
    policy: "default-src 'self'; connect-src 'self' https:; script-src 'self'"
  
  # Security headers
  headers:
    x_frame_options: DENY
    x_content_type_options: nosniff
    x_xss_protection: "1; mode=block"
    referrer_policy: no-referrer
    permissions_policy: "geolocation=(), camera=(), microphone=()"
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
    ban_duration: 3600  # 1 hour
  
  # DDoS protection
  ddos_protection:
    enabled: true
    connection_limit: 10000
    syn_cookies: true
    tcp_keepalive: true

# Logging
logging:
  level: info
  format: json
  outputs:
    - type: file
      path: /var/log/peacebonds/quic-server.log
      max_size: 100MB
      max_backups: 10
      compress: true
    - type: loki
      url: http://localhost:3100/loki/api/v1/push
      labels:
        job: quic-server
        environment: production
  
  # Log TLS handshakes
  log_tls_handshakes: true
  
  # Log connection events
  log_connections: true

# Metrics
metrics:
  enabled: true
  listen_address: 127.0.0.1:9090
  path: /metrics
  
  # Prometheus metrics
  prometheus:
    enabled: true
    namespace: peacebonds
    subsystem: quic
  
  # Export metrics
  export_metrics:
    - connections_total
    - connections_active
    - bytes_sent_total
    - bytes_received_total
    - packets_sent_total
    - packets_received_total
    - packets_lost_total
    - rtt_milliseconds
    - handshake_duration_milliseconds
    - stream_duration_milliseconds

# Health checks
health:
  enabled: true
  listen_address: 127.0.0.1:8080
  path: /health
  
  checks:
    - name: tls_certificate
      interval: 3600  # 1 hour
      timeout: 5
    - name: quic_listener
      interval: 30
      timeout: 5
    - name: backend_connectivity
      interval: 60
      timeout: 10

# Performance tuning
performance:
  # Worker threads
  worker_threads: 4
  
  # Connection queue
  connection_queue_size: 1000
  
  # Buffer sizes
  send_buffer_size: 2097152   # 2MB
  recv_buffer_size: 2097152   # 2MB
  
  # Zero-copy optimizations
  zero_copy: true
  
  # TCP Fast Open (when falling back)
  tcp_fastopen: true
  
  # Socket options
  socket_options:
    SO_REUSEADDR: true
    SO_REUSEPORT: true
    TCP_NODELAY: true
    TCP_QUICKACK: true
