# Audit Pipeline Configuration for Protocollo Meta Salvage
# Transparency and Audit Trail Management

audit_pipeline:
  name: protocollo-meta-salvage-audit
  version: "1.0"
  
  # Data Sources
  sources:
    kafka:
      bootstrap_servers:
        - kafka-broker-1:9092
        - kafka-broker-2:9092
        - kafka-broker-3:9092
      topics:
        - audit-events
        - peace-bonds-triggers
        - ethical-risk-events
      consumer_group: audit-pipeline
      
    prometheus:
      endpoint: http://prometheus:9090
      metrics:
        - symbiosis_score
        - lock_in_risk_score
        - peace_bond_status
        - throughput_metrics
        
    opa:
      endpoint: http://opa:8181
      decision_log_path: /logs/decisions
      
  # Data Processing
  processing:
    enrichment:
      enabled: true
      sources:
        - provider_metadata_api
        - compliance_registry
        - geolocation_service
      
    validation:
      schema_validation: true
      schema_version: "v1.0"
      required_fields:
        - timestamp
        - event_type
        - provider_id
        - action
        - severity
      
    transformation:
      normalize_timestamps: true
      add_checksums: true
      encrypt_sensitive_data: true
      encryption_algorithm: AES-256-GCM
      
  # Storage Backends
  storage:
    elasticsearch:
      enabled: true
      hosts:
        - http://elasticsearch-1:9200
        - http://elasticsearch-2:9200
        - http://elasticsearch-3:9200
      index_pattern: protocollo-audit-trail-%{+YYYY.MM.dd}
      retention_days: 365
      replicas: 2
      shards: 3
      
    postgresql:
      enabled: true
      host: postgresql-audit:5432
      database: audit_db
      schema: protocollo_audit
      table: audit_events
      connection_pool_size: 20
      
    mongodb:
      enabled: true
      connection_string: mongodb://mongodb-audit:27017
      database: protocollo_audit
      collection: audit_events
      
  # Audit Trail Features
  audit_trail:
    immutability:
      enabled: true
      blockchain_anchor: true
      blockchain_type: ethereum
      smart_contract: "0x..."
      
    integrity_checks:
      hash_algorithm: SHA-256
      chain_verification: true
      merkle_tree: true
      
    retention:
      default_retention_days: 365
      critical_events_retention_days: 2555  # 7 years
      archive_after_days: 90
      archive_storage: s3://protocollo-audit-archives
      
  # Transparency Requirements
  transparency:
    provider_metadata:
      required_completeness: 0.9
      update_frequency_minutes: 15
      mandatory_fields:
        - provider_id
        - service_type
        - data_location
        - processing_capacity
        - compliance_certifications
        - security_measures
        - audit_trail_endpoint
        - last_audit_timestamp
        
    audit_reports:
      generation_frequency: daily
      format: [json, pdf]
      distribution:
        - internal_dashboard
        - public_api
        - regulatory_authorities
      
    real_time_access:
      enabled: true
      api_endpoint: /api/v1/audit/real-time
      authentication: oauth2
      rate_limit: 1000  # requests per hour
      
  # Alerting
  alerts:
    - name: audit_pipeline_failure
      condition: error_rate > 0.01
      severity: critical
      notification:
        - email
        - slack
        - pagerduty
        
    - name: metadata_incompleteness
      condition: provider_metadata_completeness < 0.9
      severity: warning
      notification:
        - email
        - slack
        
    - name: audit_data_delay
      condition: last_audit_timestamp > 3600
      severity: high
      notification:
        - email
        - slack
        
    - name: integrity_check_failure
      condition: integrity_verification_failed == true
      severity: critical
      notification:
        - email
        - slack
        - pagerduty
        
  # Performance
  performance:
    batch_size: 1000
    flush_interval_seconds: 30
    max_retry_attempts: 5
    timeout_seconds: 60
    
  # Security
  security:
    encryption_at_rest: true
    encryption_in_transit: true
    access_control:
      rbac_enabled: true
      roles:
        - auditor_read_only
        - auditor_full_access
        - system_admin
    
    compliance:
      gdpr_compliant: true
      hipaa_compliant: true
      sox_compliant: true
      
  # API Configuration
  api:
    version: v1
    base_path: /api/v1/audit
    endpoints:
      - path: /events
        method: GET
        description: Query audit events
        authentication: required
        
      - path: /events/{id}
        method: GET
        description: Get specific audit event
        authentication: required
        
      - path: /reports/daily
        method: GET
        description: Get daily audit report
        authentication: required
        
      - path: /providers/{provider_id}/audit
        method: GET
        description: Get provider-specific audit trail
        authentication: required
        
      - path: /transparency/metadata
        method: GET
        description: Get transparency metadata
        authentication: public
        
    rate_limiting:
      default: 1000  # requests per hour
      authenticated: 10000  # requests per hour
      
  # Monitoring
  monitoring:
    metrics:
      - audit_events_processed_total
      - audit_pipeline_errors_total
      - audit_storage_latency_seconds
      - provider_metadata_completeness
      - integrity_checks_total
      - integrity_checks_failed_total
      
    health_checks:
      interval_seconds: 30
      endpoints:
        - elasticsearch
        - postgresql
        - mongodb
        - kafka
